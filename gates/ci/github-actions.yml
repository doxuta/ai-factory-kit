# The gate chain on every push and pull request (from the AI Factory Kit).
# Installed as .github/workflows/factory-gates.yml by
#   python3 factory/bin/adopt.py --ci github
# which never overwrites an existing file. The pre-commit hook can be skipped with
# --no-verify; this job cannot. It runs the same ./gates/run-chain.sh, so it is red while any
# slot in gates/chain.conf is TODO: install it when feature 001 (the walking skeleton) has
# wired every slot.
#
# Add the steps your chain.conf commands need (language toolchain, dependency install) before
# "Gate chain". submodules: recursive fetches factory/; a private kit repository needs a token
# with access to it.
name: factory-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Gate chain
        run: ./gates/run-chain.sh
