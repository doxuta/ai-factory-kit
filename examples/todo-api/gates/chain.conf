# gates/chain.conf of the fictional Team Todo project (a worked example in the AI Factory Kit:
# examples/todo-api/). ./gates/run-chain.sh runs these slots in order and stops at the first
# red; the pre-commit hook and CI run the same script. Wired by spec 001, the walking skeleton.
# Commands run from the project root inside the development virtual environment.

format: ruff format --check .
# node --check is a syntax check of the web client, not a lint: the client is small, plain
# JavaScript with no build step (Platform Constraints).
static: ruff check . && node --check src/todo/web/app.js
# Unit and contract tests; pytest exits 5 when it collects no test.
test: pytest -q tests/unit tests/contract
build: uv build
# Every route in src/todo/api/ has a caller in the web client (gates/orphan-endpoints.conf).
orphan-endpoints: ./gates/check-orphan-endpoints.sh
# The cross-workspace wall (Article II), per commit: two workspaces, a task in one, never
# visible or reachable from the other. The per-feature run by a teammate is acceptance.md.
acceptance: pytest -q tests/isolation
doc-sync: ./gates/check-plan-sync.sh
spec-approval: ./gates/check-spec-approval.sh
spec-numbers: ./gates/check-spec-numbers.sh
