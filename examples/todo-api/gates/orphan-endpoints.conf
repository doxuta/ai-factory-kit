# gates/orphan-endpoints.conf of the fictional Team Todo project (examples/todo-api/ in the
# AI Factory Kit). Read by ./gates/check-orphan-endpoints.sh; see its header for the keys.
# Routes are FastAPI APIRouter decorators; the only caller is the web client (Article V).
server: src/todo/api/*.py
route: @router\.(?:get|post|put|patch|delete)\(\s*["']([^"']+)["']
client: src/todo/web/*.js
