# gates/chain.conf of the fictional budget-cli project (a worked example in the AI Factory Kit:
# examples/budget-cli/). ./gates/run-chain.sh runs these slots in order and stops at the first
# red; the pre-commit hook and CI run the same script. Wired by spec 001, the walking skeleton.
# Commands run from the project root inside the development virtual environment, where
# `pip install -e .` has put the `budget` command on PATH.

format: ruff format --check .
static: ruff check .
# Extra slot (Article II): no binary float and no network module in the product code. grep
# exits 1 when nothing matches, 0 on a match and 2 on an error, so only 1 is green: a missing
# src/budget/ is red, not a vacuous green. BLIND TO: a network call made without importing
# one of these modules (subprocess curl, ctypes) and floats that never go through float().
privacy: grep -rnE '(^|[^[:alnum:]_])float\(|^[[:space:]]*(import|from)[[:space:]]+(socket|ssl|http|urllib|requests|httpx|ftplib|smtplib)([.[:space:],]|$)' src/budget; [ $? -eq 1 ]
# pytest exits 5 when it collects no test, so a filter matching nothing is already red.
test: pytest -q tests/unit
build: uv build
orphan-endpoints: NA: no network routes; the product's only entry point is the budget command, and tests/e2e runs every subcommand through it
# Per commit: the installed command, run as a subprocess on fixture files (Articles I and V).
# The per-feature run by someone other than the builder is specs/<id>/acceptance.md.
acceptance: pytest -q tests/e2e
doc-sync: ./gates/check-plan-sync.sh
spec-approval: ./gates/check-spec-approval.sh
spec-numbers: ./gates/check-spec-numbers.sh
